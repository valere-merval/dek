# must be unique in a given SonarQube instance
sonar.projectKey=com.aoe.congo:fair

# --- optional properties ---

# defaults to project key
sonar.projectName=fair design system

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.language=js
sonar.coverage.exclusions=**/styles.*
sonar.inclusions=**/*.ts,**/*.tsx
sonar.exclusions=**/*.test.*,**/*.spec.*,**/assets/**/*,**/mocks/**/*,**/__generated__/**/*,**/__mock__/**/*,**/styles.*,**/node_modules
sonar.test.inclusions=**/*.test.*,**/*.spec.*
sonar.testExecutionReportPaths=**/build/junit.xml
sonar.javascript.environments=jest
sonar.javascript.lcov.reportPaths=build/coverage/lcov.info
sonar.eslint.reportPaths=**/build/report.json
