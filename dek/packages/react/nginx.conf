server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    access_log /dev/stdout;
    error_log /dev/stdout;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    location / {
        if ($http_origin ~* "^https?://(congstar.zeroheight.com|zeroheight.com|design.congstar.de|design.congstar.net|marke.congstar.net)$") {
            add_header Access-Control-Allow-Origin "$http_origin";
            
        }
        #add_header Content-Security-Policy "frame-ancestors 'self' 'zeroheight.com' 'congstar.zeroheight.com' 'design.congstar.de' 'design.congstar.net' ";
        root   /usr/share/nginx/html;
        index  index.html index.htm;

    }

    expires 1h;
    add_header Cache-Control "public, must-revalidate";

    charset UTF-8;
}
