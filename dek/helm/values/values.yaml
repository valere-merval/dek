fullnameOverride: "fair-react"
maintainer: "team-deko"
snowballCluster: "itg-wirk"
priority: "low"

image:
  repository: core-harbor.ops-wirk.narf.tech/itg/fair-react
  port: 8080
  basePath: /
  # -- MUST: Health Check Konfiguration via livenessProbe and readinessProbe
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20

# -- SHOULD: Set Labels, Version & Name
pod:
  annotations: {}
  labels: {}

# -- How many pods must be available in parallel?
replicas:
  count: 1

# -- SHOULD: Configure rolling update
# -- https://v1-21.docs.kubernetes.io/docs/concepts/workloads/controllers/deployment/
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# MUST: configure container security
security:
  readOnlyFileSystem:
    enabled: true
    emptyDirs:
      - path: /tmp
      - path: /var/cache/nginx
      - path: /var/run/
  runAsNonRoot: true
  runAsUser: 2000
  runAsGroup: 2000

# MUST: Configure requests & limits
resources:
  requests:
    cpu: 50m
    memory: 16Mi
  limits:
    memory: 32Mi

probeMetrics:
  enabled: auto
